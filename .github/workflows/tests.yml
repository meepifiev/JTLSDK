name: Tests

on:
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Packages/**"
      - "ProjectSettings/**"
  workflow_dispatch:

jobs:
  editmode:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: License is configured
        id: license
        run: echo "available=${{ env.UNITY_LICENSE != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.license.outputs.available == 'true'
      - uses: actions/cache@v4
        if: steps.license.outputs.available == 'true'
        with:
          path: Library
          key: library-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: library-
      - uses: game-ci/unity-test-runner@v4
        if: steps.license.outputs.available == 'true'
        with:
          unityVersion: 2021.3.45f2
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results
      - name: Skipped without Unity license
        if: steps.license.outputs.available != 'true'
        run: echo "::notice::Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets to run Unity tests."
